[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mail-notify"
version = "1.0.0"
description = "Local daemon that e-mails you about Claude Code events, with a local settings web app."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mail-notify contributors" }]
keywords = ["claude", "claude-code", "notifications", "email", "hooks", "smtp"]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/lobascioemanuele-droid/mail-notify"
Source = "https://github.com/lobascioemanuele-droid/mail-notify"
Issues = "https://github.com/lobascioemanuele-droid/mail-notify/issues"
Changelog = "https://github.com/lobascioemanuele-droid/mail-notify/blob/main/CHANGELOG.md"

[project.scripts]
mail-notify = "ccmail.cli:main"
ccmail = "ccmail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ccmail = ["web/*", "skill/*"]
