name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        shell: python
        run: |
          import os, subprocess, sys
          env = dict(os.environ, PYTHONPATH=os.pathsep.join(["src", "tests"]), CCMAIL_LANG="it")
          sys.exit(subprocess.call([sys.executable, "-W", "ignore", "-m", "unittest", "discover", "-s", "tests"], env=env))
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check metadata
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Install the wheel in a clean venv and smoke test
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          export CCMAIL_HOME=/tmp/ccmail-home
          /tmp/v/bin/ccmail --version
          /tmp/v/bin/ccmail doctor || true
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
